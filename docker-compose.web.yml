# Optional: run the separate frontend repo together with the API.
# Expects the frontend checked out next to this repo as ../school-academic-web
#   docker compose -f docker-compose.yml -f docker-compose.web.yml up --build
services:
  web:
    build:
      context: ../sc-web
      args:
        VITE_SITE_NAME: "Darul Furqan Pariaman"
        VITE_SITE_TAGLINE: "Darfurqpam"
        VITE_SITE_ADDRESS: "Jalan ... Kota ..."
        VITE_SITE_PHONE: "+62 ..."
        VITE_SITE_EMAIL: "info@darfurqpam.sch.id"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "3000:80"     # public: /   admin: /admin/   API: /api/
