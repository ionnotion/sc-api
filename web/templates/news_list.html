{{define "content"}}
<h1>News &amp; announcements</h1>
<p class="filters">
  <a href="/news">All</a> · <a href="/news?type=news">News</a> · <a href="/news?type=announcement">Announcements</a>
</p>
{{range .Posts}}
<article class="card">
  <span class="tag">{{.Type}}</span>
  <h3><a href="/news/{{.Slug}}">{{.Title}}</a></h3>
  <p>{{.Excerpt}}</p>
  <small>{{date .PublishedAt}}</small>
</article>
{{else}}<p>Nothing here yet.</p>{{end}}
<p class="pager">
  {{if .HasPrev}}<a href="/news?page={{.Prev}}{{if .Type}}&type={{.Type}}{{end}}">&larr; Newer</a>{{end}}
  {{if .HasNext}}<a href="/news?page={{.Next}}{{if .Type}}&type={{.Type}}{{end}}">Older &rarr;</a>{{end}}
</p>
{{end}}
